name: Build & Release

# 打 tag（v0.1.0 这种）时构建并发布 Release；也可手动触发只构建不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 编译需要 webkit2gtk-4.1 等开发包；deb/rpm 打包需要 rpm 与 bsdtar。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential curl wget file libssl-dev \
            rpm libarchive-tools

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      # Release 版本必须和 src-tauri/Cargo.toml 一致，避免产物文件名和 tag 对不上。
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/')"
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || {
            echo "::error::tag v$TAG_VERSION 与 src-tauri/Cargo.toml 的 $PKG_VERSION 不一致，先 bump 版本再打 tag"
            exit 1
          }

      - name: Build Linux packages (deb / rpm / AppImage)
        run: ./tools/build-linux-tauri.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/netmusic-webplayer-*.deb
            src-tauri/target/release/bundle/rpm/netmusic-webplayer-*.rpm
            src-tauri/target/release/bundle/appimage/netmusic-webplayer-*.AppImage

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/netmusic-webplayer-*.deb
            src-tauri/target/release/bundle/rpm/netmusic-webplayer-*.rpm
            src-tauri/target/release/bundle/appimage/netmusic-webplayer-*.AppImage
          generate_release_notes: true

  build-pacman:
    # makepkg 是 Arch 工具且拒绝 root，用 Arch 容器 + 非 root 用户跑
    # （产物 netmusic-webplayer-<ver>-x64.pacman）。
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Create builder user and install dependencies
        run: |
          useradd -m builder
          pacman -Sy --noconfirm rust webkit2gtk-4.1 libayatana-appindicator \
            gst-plugins-good gst-plugins-base-libs gst-libav gst-plugin-pipewire \
            base-devel git

      - name: Grant workspace to builder
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build pacman package
        run: su builder -c "cd '$GITHUB_WORKSPACE' && ./tools/build-pacman-tauri.sh"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacman-package
          if-no-files-found: error
          path: dist/*.pacman

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pacman
          generate_release_notes: true
