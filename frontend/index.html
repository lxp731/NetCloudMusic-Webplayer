<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>网易云音乐</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #121212; color: #e6e6e6;
    font: 15px/1.6 system-ui, "Noto Sans CJK SC", sans-serif;
  }
  .card { max-width: 520px; padding: 32px 36px; }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  p { margin: 6px 0; color: #a7a7a7; }
  code { color: #8ab4f8; font-size: 13px; }
  .actions { margin-top: 22px; display: flex; gap: 10px; }
  button, a.button {
    appearance: none; border: 0; border-radius: 999px; cursor: pointer;
    padding: 10px 22px; font-size: 14px; font-weight: 600;
    background: #1ed760; color: #04120a; text-decoration: none;
  }
  a.button { background: #ffffff14; color: #e6e6e6; }
  button:hover { filter: brightness(1.06); }
</style>
</head>
<body>
  <div class="card">
    <h1>页面加载失败</h1>
    <p>桌面外壳没能加载网易云音乐网页版，通常是网络或代理问题。</p>
    <p id="detail"></p>
    <div class="actions">
      <button id="retry">重试</button>
      <a class="button" id="external" href="#" target="_blank" rel="noreferrer">用浏览器打开</a>
    </div>
  </div>
<script>
  var params = new URLSearchParams(location.search)
  var code = params.get('code') || ''
  var desc = params.get('desc') || ''
  var url = params.get('url') || 'https://music.163.com/st/webplayer'
  document.getElementById('detail').innerHTML =
    code || desc ? '<code>' + (code + ' ' + desc).trim() + '</code>' : ''
  document.getElementById('external').href = url
  document.getElementById('retry').addEventListener('click', function () {
    try {
      var T = window.__TAURI__
      if (T && T.core && T.core.invoke) { T.core.invoke('shell_retry'); return }
    } catch (_) {}
    location.replace(url)
  })
</script>
</body>
</html>
