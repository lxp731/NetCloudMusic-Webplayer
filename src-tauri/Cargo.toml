[package]
name = "netcloud-music"
version = "0.1.0"
description = "网易云音乐网页版的 Linux 桌面外壳（Tauri 壳）"
authors = ["netcloud-music contributors <lxp731@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "netcloud_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
mpris-server = { version = "0.10", features = ["tokio"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
